services:

  # ============================================================
  # ПОСТОЯННЫЕ СЕРВИСЫ — стартуют командой `docker compose up`
  # ============================================================

  ollama:
    image: ollama/ollama:latest
    container_name: lime-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
    # Переопределяем запуск: поднимаем сервер, ждём его готовности и сами
    # скачиваем модель внутрь volume. Если модель уже скачана с прошлого
    # раза — "ollama pull" почти мгновенно это проверяет и не качает заново.
    # $$ вместо $ — экранирование для самого Compose: переменную должен
    # подставить шелл ВНУТРИ контейнера в момент запуска, а не Compose
    # при чтении этого файла.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$LLM_MODEL"
        wait
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    # Порт наружу НЕ публикуем — только внутренняя docker-сеть

  api:
    image: lime-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lime-api
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  widget-demo:
    image: nginx:alpine
    container_name: lime-widget-demo
    volumes:
      - ./widget:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: unless-stopped

  # ============================================================
  # РАЗОВЫЕ ЗАДАЧИ (профиль "tools") — НЕ стартуют сами по себе
  # с `docker compose up`, запускаются вручную командой ниже
  # ============================================================

  download-embedding-model:
    image: lime-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./models:/app/models
    command: ["python", "-m", "scripts.download_embedding_model"]

  indexer:
    image: lime-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      download-embedding-model:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models:/app/models
      - ./logs:/app/logs
    command: ["python", "-m", "scripts.run_indexer", "--rebuild"]

  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "scripts.run_parser"]

volumes:
  ollama_data: