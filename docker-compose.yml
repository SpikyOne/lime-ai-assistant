services:

  # ============================================================
  # ПОСТОЯННЫЕ СЕРВИСЫ — стартуют командой `docker compose up`
  # ============================================================



  # ============================================================
  # OLLAMA
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: lime-ollama

    volumes:
      - ollama_data:/root/.ollama
    # Переопределяем запуск: поднимаем сервер, ждём его готовности и сами
    # скачиваем модель внутрь volume. Если модель уже скачана с прошлого
    # раза — "ollama pull" почти мгновенно это проверяет и не качает заново.
    # $$ вместо $ — экранирование для самого Compose: переменную должен
    # подставить шелл внутри контейнера в момент запуска, а не Compose
    # при чтении этого файла.
    # Порт наружу не публикуем — только внутренняя docker-сеть

    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      # Модель, однажды прогретая ниже, остаётся в памяти весь сеанс проверки.
      # Без этого Ollama сама выгружает её через 5 минут простоя (поведение
      # по умолчанию) — и следующий вопрос снова окажется "холодным" и медленным.

      # На машине с 8 ГБ RAM только одна генерация одновременно.
      OLLAMA_NUM_PARALLEL: "1"

      # Не держим несколько моделей одновременно.
      OLLAMA_MAX_LOADED_MODELS: "1"

      # После warmup модель не выгружается автоматически.
      OLLAMA_KEEP_ALIVE: "-1"

    entrypoint: [ "/bin/sh", "-c" ]
    # $$ здесь — экранирование для самого Compose: подставить переменную должен
    # шелл ВНУТРИ контейнера в момент выполнения, а не Compose при чтении файла.
    command:
      - |
        set -e

        echo "============================================================"
        echo "Запуск Ollama"
        echo "============================================================"

        ollama serve &

        echo "Жду запуска Ollama..."

        until ollama list >/dev/null 2>&1; do
        sleep 1
        done

        echo "Ollama доступна."

        echo "Проверяю наличие либо скачиваю модель $$LLM_MODEL (обычно 10-15 минут в зависимости от интернета)..."

        ollama pull "$$LLM_MODEL"

        echo "Модель $$LLM_MODEL скачана."
        echo "Ollama готова передать управление API."

        # Этот файл означает только:
        #   Ollama работает
        #   модель скачана
        # НЕ warmup. Он выполняется после загрузки E5 + Chroma внутри API.
        
        touch /tmp/ollama_ready

        wait

    healthcheck:
      # Проверяем НЕ то, что демон отвечает (это происходит за секунды и
      # ничего не говорит о готовности модели), а флаг-файл, который
      # entrypoint-скрипт создаёт только после pull И warm-up.
      test: [ "CMD", "test", "-f", "/tmp/ollama_ready" ]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 15s

    restart: unless-stopped
    # Порт наружу НЕ публикуем — только внутренняя docker-сеть



  # ============================================================
  # FASTAPI
  # ============================================================

  api:
    image: lime-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lime-api
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Внутри Docker API обращается к сервису Ollama по имени контейнера.
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      # /health означает только: FastAPI-процесс жив. Полная готовность проверяется отдельным /ready.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s



  # ============================================================
  # DEMO WIDGET
  # ============================================================

  widget-demo:
    image: nginx:alpine
    container_name: lime-widget-demo
    volumes:
      - ./widget:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: unless-stopped



  # ============================================================
  # РАЗОВЫЕ ЗАДАЧИ (профиль "tools") — НЕ стартуют сами по себе
  # с `docker compose up`, запускаются вручную командой ниже
  # ============================================================

  download-embedding-model:
    image: lime-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./models:/app/models
    command: ["python", "-m", "scripts.download_embedding_model"]


  indexer:
    image: lime-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      download-embedding-model:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models:/app/models
      - ./logs:/app/logs
    command: ["python", "-m", "scripts.run_indexer", "--rebuild"]


  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "scripts.run_parser"]


volumes:
  ollama_data: